# CI's whole job -- build an image, write a tag. CI never touches the Kubernetes API.
#
# BUILD AND DEPLOY ARE SEPARATE TRIGGERS:
#   push              -> build + push to the registry. Stops there.
#   workflow_dispatch -> build, then commit the tag, which IS the deploy.
#
# The tag commit starts an Argo Rollouts rollout with both gates, costing ~$0.27 in
# tokens per run (eval Job + synthetic load). Auto-deploying every prompt tweak spends
# that. Building on push stays free, still catches a broken Dockerfile or lockfile
# immediately, and works with the node pool scaled to zero.
#
# No loop: triggers watch source dirs; the bot commit touches charts/nova/values.yaml,
# which matches none of them.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - 'nova/**'
      - 'mcp-servers/**'
      - 'eval/**'
  workflow_dispatch:
    inputs:
      images:
        description: 'Build AND deploy which image?'
        default: nova
        type: choice
        options: [nova, mcp-servers, eval, all]

env:
  PROJECT_ID: mlops-lifecycle-p7-gke
  REGISTRY: us-west1-docker.pkg.dev/mlops-lifecycle-p7-gke/mlops-lifecycle

# Two runs would both rebase and push values.yaml; the loser deploys a stale tag.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # need HEAD^ to diff against; default depth 1 breaks it

      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.images }}" in
              nova)        dirs="nova" ;;
              mcp-servers) dirs="mcp-servers" ;;
              eval)        dirs="eval" ;;
              *)           dirs="nova mcp-servers eval" ;;
            esac
          else
            dirs=""
            files=$(git diff --name-only HEAD^ HEAD)
            echo "$files" | grep -q '^nova/'        && dirs="$dirs nova"        || true
            echo "$files" | grep -q '^mcp-servers/' && dirs="$dirs mcp-servers" || true
            echo "$files" | grep -q '^eval/'        && dirs="$dirs eval"        || true
          fi

          # Directory name != values.yaml key (mcp-servers -> images.mcp), so map explicitly.
          entries=""
          for d in $dirs; do
            case "$d" in
              nova)        entries="$entries {\"dir\":\"nova\",\"key\":\"nova\",\"image\":\"nova\"}," ;;
              mcp-servers) entries="$entries {\"dir\":\"mcp-servers\",\"key\":\"mcp\",\"image\":\"mcp-servers\"}," ;;
              eval)        entries="$entries {\"dir\":\"eval\",\"key\":\"eval\",\"image\":\"nova-eval\"}," ;;
            esac
          done

          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$dirs" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "building:${dirs:- nothing}"

  build:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.changed.outputs.matrix) }}
      max-parallel: 1     # both jobs push to main; parallel means one rebases mid-flight
    steps:
      - uses: actions/checkout@v4

      # Long-lived SA key by decision 2026-08-25; see terraform-gcp/cicd.tf for the WIF path.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: tag
        # Derived from the COMMIT, not from `date` at run time, so the same commit always
        # yields the same tag. That is what lets a deploy reuse the image the push built
        # instead of rebuilding it -- build once, deploy that same artifact.
        run: |
          echo "tag=$(git log -1 --format=%cd --date=format:%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Skips the build when this commit's image already exists — which is the normal
      # case for a deploy, since the push already built it.
      # Needs roles/viewer on the SA: gcloud refuses to stream Cloud Build's default logs
      # bucket otherwise, and exits 1 on a build that actually succeeded.
      - name: Build and push
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}"
          if gcloud artifacts docker images describe "$ref" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            echo "$ref already exists — reusing it, not rebuilding"
          else
            gcloud builds submit ${{ matrix.dir }}/ --tag "$ref" --project "${PROJECT_ID}"
          fi

      # DEPLOY STEP -- manual dispatch only. A push builds and stops before this.
      - name: Bump the chart and push
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          yq -i '.images.${{ matrix.key }}.tag = "${{ steps.tag.outputs.tag }}"' charts/nova/values.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/nova/values.yaml
          git commit -m "deploy(${{ matrix.image }}): ${{ steps.tag.outputs.tag }}"

          # main may have moved while the build ran; without this the push is rejected
          # after the expensive step and the image never deploys.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "### Deployed \`${{ matrix.image }}\` → \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Argo CD syncs within ~3 min, then Argo Rollouts runs both gates:" >> "$GITHUB_STEP_SUMMARY"
            echo '`kubectl argo rollouts get rollout nova -n nova --watch`' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Built \`${{ matrix.image }}\` → \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Not deployed** — the chart still points at the old tag. To ship it:" >> "$GITHUB_STEP_SUMMARY"
            echo '`gh workflow run build-and-deploy.yml -f images=${{ matrix.dir }}`' >> "$GITHUB_STEP_SUMMARY"
          fi
