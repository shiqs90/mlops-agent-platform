# Build changed images, commit the new tag to charts/nova/values.yaml. That commit IS the
# deploy — Argo CD sees it and rolls the pods. CI never touches the Kubernetes API.
#
# No loop: triggers watch nova/** and mcp-servers/**; the bot commit touches
# charts/nova/values.yaml, which matches neither.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - 'nova/**'
      - 'mcp-servers/**'
  workflow_dispatch:
    inputs:
      images:
        description: 'Force a rebuild: nova, mcp-servers, or both'
        default: nova
        type: choice
        options: [nova, mcp-servers, both]

env:
  PROJECT_ID: mlops-lifecycle-p7-gke
  REGISTRY: us-west1-docker.pkg.dev/mlops-lifecycle-p7-gke/mlops-lifecycle

# Two runs would both rebase and push values.yaml; the loser deploys a stale tag.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # need HEAD^ to diff against; default depth 1 breaks it

      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.images }}" in
              nova)        dirs="nova" ;;
              mcp-servers) dirs="mcp-servers" ;;
              *)           dirs="nova mcp-servers" ;;
            esac
          else
            dirs=""
            files=$(git diff --name-only HEAD^ HEAD)
            echo "$files" | grep -q '^nova/'        && dirs="$dirs nova"        || true
            echo "$files" | grep -q '^mcp-servers/' && dirs="$dirs mcp-servers" || true
          fi

          # Directory name != values.yaml key (mcp-servers -> images.mcp), so map explicitly.
          entries=""
          for d in $dirs; do
            case "$d" in
              nova)        entries="$entries {\"dir\":\"nova\",\"key\":\"nova\",\"image\":\"nova\"}," ;;
              mcp-servers) entries="$entries {\"dir\":\"mcp-servers\",\"key\":\"mcp\",\"image\":\"mcp-servers\"}," ;;
            esac
          done

          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$dirs" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "building:${dirs:- nothing}"

  build:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.changed.outputs.matrix) }}
      max-parallel: 1     # both jobs push to main; parallel means one rebases mid-flight
    steps:
      - uses: actions/checkout@v4

      # Long-lived SA key by decision 2026-08-25; see terraform-gcp/cicd.tf for the WIF path.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: tag
        # Date for humans, short SHA so a running pod traces back to the exact commit.
        run: echo "tag=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Needs roles/viewer on the SA — gcloud refuses to stream Cloud Build's default
      # logs bucket otherwise, and exits 1 on a build that actually succeeded.
      - name: Build and push
        run: |
          gcloud builds submit ${{ matrix.dir }}/ \
            --tag "${REGISTRY}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}" \
            --project "${PROJECT_ID}"

      - name: Bump the chart and push
        run: |
          set -euo pipefail
          yq -i '.images.${{ matrix.key }}.tag = "${{ steps.tag.outputs.tag }}"' charts/nova/values.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/nova/values.yaml
          git commit -m "deploy(${{ matrix.image }}): ${{ steps.tag.outputs.tag }}"

          # main may have moved while the build ran; without this the push is rejected
          # after the expensive step and the image never deploys.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "### Deployed \`${{ matrix.image }}\` → \`${{ steps.tag.outputs.tag }}\`"
            echo ""
            echo "Argo CD applies within ~3 min. Verify:"
            echo '```'
            echo "kubectl -n nova rollout status deploy/${{ matrix.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
