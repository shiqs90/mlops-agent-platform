# Golden set — 18 cases, 8 of 9 tools. Design rationale lives in README.md
# ("The golden set"); this file is the fixture.
#
# Fields: question, expect_tools, expect_params, optional setup (prior turn),
#         optional expect_answer (COVERAGE only, never a value — 3 cases).
#
# Shapes: single | multi | memory | refuse
#
# Structural facts the cases depend on — no balances, nothing here is asserted:
#   ACC-00004  current, HAS an overdraft limit, ZERO cards   (gs-008, gs-002)
#   ACC-00002  1 ACTIVE CREDIT card, so credit_limit is non-NULL   (gs-015)
#   ACC-00004  7 transactions with counterparty "Talabat"          (gs-014)
#   ACC-00003  savings, no overdraft, exactly 1 card
#   ACC-00001  savings, no overdraft, ZERO cards
#
# After any reseed, re-check with README-placeholders.sql: gs-002 assumes ACC-00004
# still has no cards, and a reseed that gives it one breaks the case silently.
#
# initiate_transfer has no case until Phase 2.5 lands human approval.

- id: gs-001
  shape: single
  question: "What is the balance on account ACC-00004?"
  expect_tools: [check_balance]
  expect_params: {account_id: ACC-00004}

- id: gs-002
  shape: refuse
  # Moved from `single` to `refuse` 2026-08-25. ACC-00004 has ZERO cards, so this was
  # never testing whether the agent can read card fields — an empty tool result makes
  # faithfulness trivially passable. As a `refuse` case it is doing real work: the
  # correct behaviour is to say there are none, and the failure mode it guards is
  # inventing a card. gs-015 is the case that actually exercises card fields.
  question: "Which cards are linked to account ACC-00004?"
  expect_tools: [get_cards]
  expect_params: {account_id: ACC-00004}

- id: gs-003
  shape: single
  question: "Show me the transactions on ACC-00004 for July 2026."
  expect_tools: [query_transactions]
  expect_params: {account_id: ACC-00004, start_date: "2026-07-01", end_date: "2026-07-31"}

- id: gs-004
  shape: single
  # Carries a reference because the tool returns a BREAKDOWN and the tempting failure
  # is to summarise it — "you spent most on rent" — which is faithful, relevant, and
  # not what was asked. Coverage is the only metric that objects.
  question: "How much did account ACC-00004 spend by category in June 2026?"
  expect_tools: [spending_by_category]
  expect_params: {account_id: ACC-00004, start_date: "2026-06-01", end_date: "2026-06-30"}
  expect_answer: >-
    Every category the tool returned must appear in the answer with its amount. Naming
    only the largest categories, or giving a single total, is incomplete.

- id: gs-005
  shape: single
  # Relative date. The system prompt pins "today" to 2026-08-01, so "last month"
  # must resolve to July — this is the argument_correctness case that fails most often.
  question: "Did my salary land last month on ACC-00004?"
  expect_tools: [query_transactions]
  expect_params: {account_id: ACC-00004, start_date: "2026-07-01", end_date: "2026-07-31"}

- id: gs-006
  shape: single
  question: "What loans does customer CUS-00012 have?"
  expect_tools: [get_loans]
  expect_params: {customer_id: CUS-00012}

- id: gs-007
  shape: single
  question: "List every account belonging to customer CUS-00012."
  expect_tools: [list_accounts]
  expect_params: {customer_id: CUS-00012}

- id: gs-008
  shape: multi
  # Two different tools in one turn. Order isn't asserted — only that both ran.
  #
  # A TWO-PART QUESTION, and that is why it carries a reference. The likely failure is
  # not a false statement — it is answering the overdraft half and quietly dropping the
  # salary half. That answer is fully faithful (every claim supported), fully relevant
  # (it is about the account that was asked about), and half an answer.
  question: "Is ACC-00004 within its overdraft limit, and did any salary arrive in July 2026?"
  expect_tools: [check_balance, query_transactions]
  expect_params: {account_id: ACC-00004}
  expect_answer: >-
    Both halves must be answered: an explicit verdict on whether the account is within
    its overdraft limit, AND whether a salary credit arrived in July 2026. Omitting
    either half is a failure even if the half that is given is correct.

- id: gs-009
  shape: memory
  # Two-turn case. The setup runs first, then the question — which names no account.
  # Tests that history resolves the reference AND that the tool is still called
  # rather than the earlier answer being reused.
  setup: "What is the balance on ACC-00004?"
  question: "And what were its transactions in June 2026?"
  expect_tools: [query_transactions]
  expect_params: {account_id: ACC-00004, start_date: "2026-06-01", end_date: "2026-06-30"}

- id: gs-010
  shape: memory
  # The stale-answer regression (war story #18). Same question twice; the second
  # MUST still call the tool.
  #
  # Note the failure here looks BETTER than the pass — faster, cheaper, and the right
  # number — until the underlying data changes. expect_tools being non-empty is the
  # entire assertion; the answer text is identical either way.
  setup: "What is the balance on ACC-00004?"
  question: "What is the balance on ACC-00004?"
  expect_tools: [check_balance]
  expect_params: {account_id: ACC-00004}

- id: gs-011
  shape: refuse
  # Nonexistent account. The tool returns an error; the agent must report that
  # rather than inventing a balance. Faithfulness is the metric that catches a
  # fabricated number here.
  question: "What is the balance on account ACC-99999?"
  expect_tools: [check_balance]
  expect_params: {account_id: ACC-99999}

- id: gs-012
  shape: refuse
  # Out of scope entirely — no tool covers exchange rates. Should decline rather
  # than guess, and should not call an unrelated tool.
  question: "What is today's USD to AED exchange rate?"
  expect_tools: []
  expect_params: {}

# --- Added 2026-08-25 — closing tool-coverage gaps found while redesigning the suite.
# get_customer, find_transactions, and get_cards-with-data had NO case at all, which
# meant a regression in any of them would have shipped green.

- id: gs-013
  shape: single
  # get_customer had zero coverage. Also the first case whose tool returns PII, which
  # makes it the natural place to assert Phase 2.5's masking once that lands.
  question: "Who is customer CUS-00012?"
  expect_tools: [get_customer]
  expect_params: {customer_id: CUS-00012}

- id: gs-014
  shape: single
  # find_transactions had zero coverage, and it is the only tool taking a free-text
  # argument — so it is the only place argument_correctness tests EXTRACTION rather than
  # formatting. The agent has to lift the search term out of the sentence unchanged.
  #
  # Resolved 2026-08-25 to "Talabat" — a COUNTERPARTY with 7 matching rows on
  # ACC-00004, not a description. That matches what the tool is documented for ("did I
  # pay DEWA", "find my Carrefour charges") and makes the case a proper-noun extraction
  # test. "Salary" was rejected: it collides with gs-005, so a routing regression there
  # would surface as two failures with one cause.
  #
  # WATCH THIS ONE. argument_correctness compares strings exactly, while the tool
  # matches with ILIKE. If the agent passes "talabat", the tool behaves identically and
  # the metric still scores 0. That would be a metric artefact, not an agent defect —
  # if it happens, case-fold this field rather than "fixing" the agent.
  question: "Find any transactions on ACC-00004 involving Talabat."
  expect_tools: [find_transactions]
  expect_params: {account_id: ACC-00004, search_term: Talabat}

- id: gs-015
  shape: single
  # The card case gs-002 was supposed to be. ACC-00002 holds an active CREDIT card, so
  # the answer has real fields to get wrong — credit_limit is NULL on debit cards, and
  # `status` is exactly the field an agent drops ("you have a card" and "you have a card
  # that works" are different claims).
  question: "Which cards are linked to account ACC-00002?"
  expect_tools: [get_cards]
  expect_params: {account_id: ACC-00002}

- id: gs-016
  shape: multi
  # Fan-out rather than sequencing: one lookup, then the same tool per result. Tests
  # that the agent does not stop after the first account. tool_correctness scores this
  # as a set, so repeated check_balance calls count once — what this really guards is
  # faithfulness, which fails if the agent summarises accounts it never queried.
  question: "List CUS-00012's accounts and tell me the balance on each."
  expect_tools: [list_accounts, check_balance]
  expect_params: {customer_id: CUS-00012}
  expect_answer: >-
    A balance must be given for EVERY account that list_accounts returned. Covering a
    subset, or giving a combined total instead of per-account figures, is incomplete —
    and is fully faithful, which is exactly why this case needs a reference.

- id: gs-017
  shape: memory
  # Multi-turn quality, which the other memory cases do not test: after a topic
  # switch, does the agent still hold the account from turn one? gs-009 asks a
  # follow-up in the SAME topic, which is a much easier reference to resolve.
  setup: "What is the balance on ACC-00004?"
  question: "Forget the balance — what did that account spend on in June 2026?"
  expect_tools: [spending_by_category]
  expect_params: {account_id: ACC-00004, start_date: "2026-06-01", end_date: "2026-06-30"}

- id: gs-018
  shape: refuse
  # Missing required parameter. Nothing in the conversation names an account, so
  # there is no correct account_id to pass — the only correct move is to ask.
  #
  # The failure this guards is specific and nasty: an agent that invents a plausible
  # account ID (ACC-00001) and answers confidently about someone else's money. Note
  # expect_tools is empty, so calling ANY tool scores 0 on tool_correctness.
  question: "What's my balance?"
  expect_tools: []
  expect_params: {}
