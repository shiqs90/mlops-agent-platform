# PINNED: argo/argo-cd chart 10.4.0 -> Argo CD v3.5.1 (selected 2026-08-24).
#
#   helm install argocd argo/argo-cd --version 10.4.0 \
#     --namespace argocd --create-namespace \
#     --values gitops/bootstrap/argocd-values.yaml
#
# The version lives here rather than only in someone's shell history because
# `helm install` without --version resolves to whatever the repo serves that day.
# Same discipline as nova/requirements.lock, and for the same reason: three outages
# in this build came from dependency resolution rather than from code.
#
# Argo CD Helm values, trimmed for a 2-node e2-standard-4 pool that is already
# running kube-prometheus-stack, ESO, Postgres, Redis, Nova, and three MCP servers.
#
# A default Argo CD install brings up seven workloads. Three of them do nothing for
# this platform, and on a cluster this size "does nothing" still means reserved CPU
# that Nova cannot schedule against.
#
# MEMORY LIMITS BUT NO CPU LIMITS — this is deliberate and worth being able to
# defend. A CPU limit does not protect the node; the scheduler already reserves via
# requests. What a CPU limit does is throttle the container at the cgroup quota, and
# a throttled *controller* reconciles slowly under exactly the load where you need
# it fast. Memory is different: it is incompressible, and a leaking pod without a
# limit takes the node down with it. So: limit the thing that kills the node, do not
# limit the thing that only makes the controller slower.
dex:
  # SSO connector. There is no external IdP here; the admin password is enough.
  # (In the sovereign/on-prem version of this platform, this is exactly where
  # Keycloak or internal LDAP would wire in — the component exists for that reason.)
  enabled: false

notifications:
  # Slack/webhook fan-out on sync events. Prometheus already alerts on what matters.
  enabled: false

applicationSet:
  # Generates Applications from templates across many repos/clusters. App-of-apps
  # uses plain Application resources and does not need it.
  #
  # `applicationSet.enabled: false` DOES NOT EXIST in chart 10.x — the toggle was
  # removed and the controller became a core component. Setting it did nothing, and
  # Helm reported no error: an unknown value is stored and silently ignored, so
  # `helm get values` showed `enabled: false` while the pod ran anyway. Proven by
  # rendering the chart twice and comparing — expected 28 then 0, got 28 then 28:
  #   helm template argocd argo/argo-cd --version 10.4.0 \
  #     | grep -c applicationset-controller
  #   helm template argocd argo/argo-cd --version 10.4.0 \
  #     --set applicationSet.enabled=false | grep -c applicationset-controller
  # A live `enabled` flag guards the whole template file with {{- if }}, so false
  # drops every resource at once. Equal counts mean no such guard exists.
  #
  # Kept at the chart default rather than forced to 0. The 10.x chart treats this as
  # a core component, and running one idle controller (~50-100m) is cheaper than
  # carrying a local deviation we would have to re-justify every chart upgrade.
  # ApplicationSet generators may earn their keep later anyway — one Application per
  # model, or per environment.
  #
  # THE GENERAL LESSON: `helm get values` shows what you SUPPLIED, not what took
  # effect. `helm get values -a` shows the computed merge (it would have shown
  # `replicas: 1` here immediately). `helm get manifest` shows what was applied.
  # Same failure shape as the ESO v1/v1beta1 war story — the installed artifact
  # decides, not the docs.
  replicas: 1

configs:
  params:
    # Serve plain HTTP. There is no ingress or cert in front of Argo CD — access is
    # via `kubectl port-forward`, so TLS would be terminated at localhost against a
    # self-signed cert, which buys nothing and breaks the CLI without --insecure.
    # This is a port-forward-only posture, NOT a production one: exposing this
    # server needs an ingress with real TLS before anything else.
    server.insecure: true

    # How often Argo CD re-reads git. Default is 180s. Left at default deliberately:
    # shortening it to feel more responsive means polling GitHub harder for no real
    # gain, and the correct fix for "I want it now" is `argocd app sync`, or a
    # webhook in E1b.
    # timeout.reconciliation: 180s

controller:
  # The application-controller — the reconciliation engine, and the only component
  # that actually changes the cluster. Loop: ask repo-server what git says, ask the
  # Kubernetes API what is live, diff them, apply the difference. `prune` and
  # `selfHeal` are its behaviours, not the server's.
  #
  # The heaviest of the four, and the reason is memory: it keeps an in-memory cache
  # of every resource it manages so it can diff without re-listing the API on each
  # pass. That cache grows with the size of the cluster, not the size of the repo —
  # which is the opposite of repo-server below, and why these two numbers differ.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

repoServer:
  # The ONLY component that touches git. Clones the repo, runs `helm template` on
  # charts/nova, hands the rendered YAML back. It never talks to the Kubernetes API
  # — it turns source into manifests and nothing else.
  #
  # Works in bursts (on a sync, or when the ~180s poll finds a new commit) and holds
  # one repo's manifests at a time, so it needs less headroom than the controller.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

server:
  # API, web UI, and the endpoint the `argocd` CLI talks to. NOT in the
  # reconciliation path: if this pod dies, syncing carries on normally and all you
  # lose is your ability to watch it. Useful to know at 3am — "the Argo CD UI is
  # down" and "deployments are broken" are unrelated statements.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

redis:
  # Argo CD's own manifest cache. Unrelated to the Redis holding Nova's session
  # memory — different namespace, different purpose, and losing this one costs a
  # re-render, not a conversation.
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
