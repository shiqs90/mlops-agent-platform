# Pulls the Postgres password out of GCP Secret Manager and materialises it as a
# normal Kubernetes Secret named `postgres-credentials`, which the StatefulSet
# already references.
#
# Both objects are safe to commit: neither contains the value, only a pointer to it.
# That is the whole point — Argo CD can sync these, and a cluster rebuilt from this
# repo gets its secrets back without anyone running `kubectl create secret`.
#
# API VERSION: this cluster's CRDs registered as external-secrets.io/v1 (checked
# 2026-08-16 via `kubectl api-resources | grep external-secrets`). External Secrets
# moved v1beta1 → v1 around its 1.0 release, so an older chart would need v1beta1
# here instead. Re-check after any chart upgrade — the CRDs decide, not the docs.
---
# Where to fetch from. Namespaced (SecretStore, not ClusterSecretStore) so the
# nova namespace can only reach secrets this store exposes — a ClusterSecretStore
# would make every namespace a potential reader.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: nova
spec:
  provider:
    gcpsm:
      projectID: mlops-lifecycle-p7-gke
      # No `auth:` block on purpose. Omitted, the provider uses the operator pod's
      # ambient credentials — which Workload Identity has bound to the
      # external-secrets GCP service account. Supplying a secretRef here would
      # reintroduce the static credential this design exists to avoid.
---
# What to fetch, and what to call it locally.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: nova
spec:
  # Re-reads Secret Manager hourly, so rotating the value there propagates without
  # a redeploy. Note the pod does NOT restart on change — Postgres reads the env
  # var once at startup, so a rotation needs a rollout to take effect.
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore

  target:
    name: postgres-credentials   # must match the StatefulSet's secretKeyRef
    creationPolicy: Owner        # ESO owns it; deleting this CR deletes the Secret

  data:
    - secretKey: password              # key inside the Kubernetes Secret
      remoteRef:
        key: nova-postgres-password    # secret_id in GCP Secret Manager
